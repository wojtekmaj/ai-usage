name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate_tag:
    name: Validate tag
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1

    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}

    steps:
      - name: Validate tag format
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ -z "$TAG_NAME" ]]; then
            echo "GITHUB_REF_NAME is empty" >&2
            exit 2
          fi

          VERSION="${TAG_NAME#v}"

          # Semver-ish: X.Y.Z with optional -prerelease and/or +build metadata.
          # Keep this compatible with scripts/build-app.sh and scripts/package-dmg.sh.
          SEMVER_LIKE_VERSION_REGEX='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          # Reject any whitespace/control chars or other unexpected characters.
          if [[ "$VERSION" =~ [^0-9A-Za-z.+-] ]]; then
            echo "Invalid tag version: '$VERSION'" >&2
            echo "Expected semver-ish format like '1.2.3', optionally with '-rc.1' and/or '+build.5'." >&2
            exit 2
          fi

          if ! [[ "$VERSION" =~ $SEMVER_LIKE_VERSION_REGEX ]]; then
            echo "Invalid tag version: '$VERSION'" >&2
            echo "Expected semver-ish format like '1.2.3', optionally with '-rc.1' and/or '+build.5'." >&2
            exit 2
          fi

          PRERELEASE="false"
          # prerelease is only determined by the part before any build metadata (+...)
          # e.g. 1.2.3+build-5 is NOT a prerelease, but 1.2.3-rc.1+build-5 IS.
          BASE_NO_BUILD="${VERSION%%+*}"
          if [[ "$BASE_NO_BUILD" == *-* ]]; then
            PRERELEASE="true"
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build_macos:
    name: Build macOS DMG
    needs: validate_tag
    runs-on: macos-latest
    timeout-minutes: 15

    env:
      VERSION: ${{ needs.validate_tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package macOS DMG
        shell: bash
        run: ./scripts/package-dmg.sh --version "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: .build/AI-Usage-${{ needs.validate_tag.outputs.version }}.dmg
          if-no-files-found: error

  build_windows:
    name: Build Windows ${{ matrix.architecture }} ZIP
    needs: validate_tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: windows-11-arm
          - architecture: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.validate_tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Package portable Windows app
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Architecture ${{ matrix.architecture }} -Version $env:VERSION

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.architecture }}-release
          path: artifacts/AI-Usage-${{ needs.validate_tag.outputs.version }}-windows-*.zip
          if-no-files-found: error

  publish_release:
    name: Publish release
    needs: [validate_tag, build_macos, build_windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate_tag.outputs.tag }}
          name: AI Usage v${{ needs.validate_tag.outputs.version }}
          prerelease: ${{ needs.validate_tag.outputs.prerelease }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
