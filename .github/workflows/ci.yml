name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests_macos:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build shared core
        run: cargo build --workspace

      - name: Run tests
        run: swift test

  tests_linux:
    name: Tests (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tests
        run: cargo test --workspace

  tests_windows:
    name: Tests (Windows ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: windows-11-arm
          - architecture: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run tests
        shell: pwsh
        run: cargo test --workspace

  build_windows:
    name: Build (Windows ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: windows-11-arm
          - architecture: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build portable Windows app
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Architecture ${{ matrix.architecture }} -Version 0.0.0 -SkipArchive

  build_macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: swift build

  package_macos:
    name: Package (macOS DMG)
    runs-on: macos-latest
    timeout-minutes: 15

    env:
      CI_VERSION: 0.0.0-ci.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create package
        shell: bash
        run: |
          ./scripts/package-dmg.sh \
            --version "$CI_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-usage-dmg
          path: .build/AI-Usage-${{ env.CI_VERSION }}.dmg
          if-no-files-found: error
