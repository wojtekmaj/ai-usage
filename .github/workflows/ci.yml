name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit:
    name: macOS app unit tests
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build shared core and run tests
        run: |
          cargo build --workspace
          swift test

  shared-core:
    name: Shared core tests (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Rust tests
        run: cargo test --workspace

  windows:
    name: Windows app build and shared core tests (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: windows-11-arm
          - architecture: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test shared core
        shell: pwsh
        run: cargo test --workspace

      - name: Build portable Windows app
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Architecture ${{ matrix.architecture }} -Version 0.0.0 -SkipArchive

  build:
    name: macOS app build
    runs-on: macos-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: swift build

  package:
    name: macOS DMG package
    runs-on: macos-latest
    timeout-minutes: 15

    env:
      CI_VERSION: 0.0.0-ci.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create package
        shell: bash
        run: |
          ./scripts/package-dmg.sh \
            --version "$CI_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-usage-dmg
          path: .build/AI-Usage-${{ env.CI_VERSION }}.dmg
          if-no-files-found: error
