    <!-- Local apex clips follow the exact outer front curves, then release below the tips. -->
    <clipPath id="greenApexClip" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1024" height="589"/>
      <path d="M0 589 H844 C869 598 889 615 900 637 V641 H0 Z"/>
      <rect x="0" y="641" width="1024" height="383"/>
    </clipPath>
