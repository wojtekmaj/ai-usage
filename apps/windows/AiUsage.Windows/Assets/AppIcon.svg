  <path d="M203 501 C203 544 238 579 281 579 H779 C802 579 825 582 844 589 C869 598 889 615 900 637 L895 640 C885 618 866 602 842 593 C824 586 802 583 779 583 H281 C238 583 203 548 203 501 Z" fill="url(#greenBevel)" clip-path="url(#greenApexClip)"/>

  <!-- Front material overlaps the unchanged edge by 2–3 units through the apex. -->
  <path d="M810 580 C822 581 834 584 844 589 C869 598 889 615 900 637 L898 638 C887 616 868 600 843 591 C833 587 822 583 810 580 Z" fill="url(#greenFace)" clip-path="url(#greenApexClip)"/>
