      <feFlood flood-color="#142743" flood-opacity="0.21" result="color"/>
      <feComposite in="color" in2="offset" operator="in"/>
    </filter>
    <filter id="foldOcclusion" x="757" y="563" width="171" height="282" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="-2" dy="3" stdDeviation="5" flood-color="#0A1523" flood-opacity="0.22"/>
    </filter>
    <filter id="softEdge" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.65"/>
    </filter>
