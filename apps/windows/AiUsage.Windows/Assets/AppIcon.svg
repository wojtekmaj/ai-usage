      <path d="M0 737 H836 C863 745 884 760 891 780 V783 H0 Z"/>
      <rect x="0" y="783" width="1024" height="241"/>
    </clipPath>

    <filter id="panelShadow" x="88" y="77" width="847" height="881" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="20" flood-color="#000000" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#233044" flood-opacity="0.16"/>
    </filter>
    <filter id="greenShadow" x="170" y="485" width="772" height="222" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feOffset in="blur" dy="10" result="offset"/>
      <feFlood flood-color="#0A2631" flood-opacity="0.2" result="color"/>
      <feComposite in="color" in2="offset" operator="in"/>
    </filter>
    <filter id="blueShadow" x="175" y="675" width="748" height="167" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
