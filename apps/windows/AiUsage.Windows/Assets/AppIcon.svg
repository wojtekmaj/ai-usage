  <!-- Full tails live behind the white panel and only emerge beyond its right edge. -->
  <path d="M779 579 C802 579 825 582 844 589 C868 598 887 614 897 635 C900 646 899 657 895 667 C890 679 881 688 869 693 C856 698 842 696 831 690 C847 686 859 678 864 666 C869 653 865 641 853 629 C834 609 807 592 779 589 Z" fill="url(#greenFold)" clip-path="url(#greenApexClip)"/>
