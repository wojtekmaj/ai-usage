[package]
name = "ai-usage-core"
version = "1.2.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
pretty_assertions = "1"
